
name: Tourism Package Prediction MLOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/requirements.txt # Use project-level requirements

      - name: Run Data Registration
        run: |
          python tourism_project/model_building/data_register.py

      - name: Run Data Preparation (Preprocessing and Split)
        run: |
          python tourism_project/model_building/prep.py

      - name: Run Model Training and Evaluation
        # Set MLflow tracking URI for GitHub Actions if needed.
        # This example assumes MLflow server is accessible, or uses local artifacts.
        # For remote tracking, add: env: MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python tourism_project/model_building/train.py

      - name: Verify Deployment Files
        run: |
          python -c "import os; assert os.path.exists('tourism_project/deployment/app.py')"
          python -c "import os; assert os.path.exists('tourism_project/deployment/requirements.txt')"
          python -c "import os; assert os.path.exists('tourism_project/deployment/best_tourism_package_model_v1.joblib')"

      - name: Commit Trained Model
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-commit: Trained model from MLOps pipeline"
          file_pattern: "tourism_project/deployment/*.joblib" # Only commit the model file
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "GitHub Actions Bot <github-actions[bot]@users.noreply.github.com>"
