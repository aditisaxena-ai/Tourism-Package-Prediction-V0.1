
name: Tourism Package Prediction MLOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Processing
        run: |
          python tourism_project/data_processing/data_preprocessing.py

      - name: Run Model Training
        run: |
          python tourism_project/model_building/train.py

      - name: Run Model Evaluation
        run: |
          python tourism_project/model_building/evaluate.py

      - name: Verify Deployment Files
        run: |
          python -c "import os; assert os.path.exists('tourism_project/deployment/app.py')"
